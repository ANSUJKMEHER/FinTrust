; FinTrust RAG - Enterprise PgBouncer Configuration
; Mode: Transaction Pooling for Multi-Tenant RAG Workloads

[databases]
fintrust_db = host=postgres port=5432 dbname=fintrust_db auth_user=fintrust_user

[pgbouncer]
; Networking
listen_addr = 0.0.0.0
listen_port = 6432

; Authentication
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt
admin_users = fintrust_user
stats_users = fintrust_user

; Pooling Mode
; Transaction pooling allows sharing server connections between transactions.
; Best for web workloads with short-lived transactions.
pool_mode = transaction

; Connection Limits & Budgets
; PostgreSQL max_connections is configured to 100 (superuser reserved = 3).
; Max server connections allocated to PgBouncer: 80.
; Max client connections allowed from all backend replicas: 1,000.
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 5
reserve_pool_size = 5
reserve_user = 5
max_db_connections = 80
max_user_connections = 80

; Timeouts & Lifecycles
server_idle_timeout = 600
server_connect_timeout = 15
server_login_retry = 15
server_round_robin = 1
client_idle_timeout = 0
client_login_timeout = 60
query_timeout = 120
query_wait_timeout = 120

; TCP Keepalive & Buffer Optimization
so_reuseport = 1
tcp_keepalive = 1
tcp_keepidle = 30
tcp_keepinterval = 10
tcp_keepcnt = 5
pkt_buf = 4096
max_packet_size = 2147483648

; Log verbosity
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
stats_period = 60
