name: FinTrust CI - Quality, Security & Tests

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  lint-and-typecheck:
    name: Frontend & Backend Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package.json

      - name: Build and Typecheck Frontend
        working-directory: ./frontend
        run: |
          npm ci
          npm run build

  test-postgresql-pgvector:
    name: Backend Test Suite (PostgreSQL 16 + pgvector)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: fintrust_user
          POSTGRES_PASSWORD: fintrust_secure_ci_password
          POSTGRES_DB: fintrust_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Alembic Database Migrations
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: fintrust_user
          POSTGRES_PASSWORD: fintrust_secure_ci_password
          POSTGRES_DB: fintrust_db
          DATABASE_URL: postgresql://fintrust_user:fintrust_secure_ci_password@localhost:5432/fintrust_db
          JWT_SECRET_KEY: ci_secret_key_testing_purposes_only_min_32_characters_long
        run: |
          python -m alembic upgrade head

      - name: Run Pytest Test Suite
        env:
          ENVIRONMENT: development
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_USER: fintrust_user
          POSTGRES_PASSWORD: fintrust_secure_ci_password
          POSTGRES_DB: fintrust_db
          DATABASE_URL: postgresql://fintrust_user:fintrust_secure_ci_password@localhost:5432/fintrust_db
          JWT_SECRET_KEY: ci_secret_key_testing_purposes_only_min_32_characters_long
          FINTRUST_USE_MOCK_EMBEDDINGS: "0"
        run: |
          python -m pytest app/tests -v --junitxml=test-results.xml

      - name: Upload Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pytest-results
          path: test-results.xml
